# L'essai local de l'image de production, avec sa base : make up, make logs, make down.
# Les secrets viennent du .env (make env) par interpolation : jamais écrits ici. En production,
# ils vivent chez l'hébergeur. make smoke vérifie que l'image démarre, puis nettoie tout.
# Le nom du projet nomme ses conteneurs et ses volumes : deux projets ne se mélangent jamais.
name: documental
services:
  app:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    ports:
      - '127.0.0.1:${APP_PORT:-8787}:8787'
    environment:
      NODE_ENV: production
      PORT: 8787
      LOCAL_TRIAL: 'true'
      SHUTDOWN_TIMEOUT_MS: 7000
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app
      APP_URL: http://localhost:8787
      AUTH_SECRET: ${AUTH_SECRET:?définir AUTH_SECRET dans .env pour l'essai local}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-resend}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Ne pas répondre <noreply@exemple.fr>}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:8787/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    # SIGTERM, puis l'arrêt propre (SHUTDOWN_TIMEOUT_MS) avant que Docker ne force.
    stop_grace_period: 10s
    restart: unless-stopped
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env (make env)}
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
